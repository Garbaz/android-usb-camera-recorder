[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
materialIcons = "1.7.8"
aboutLibraries = "15.3.0"

[libraries]
