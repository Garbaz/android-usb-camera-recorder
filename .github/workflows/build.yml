name: Build

# Pushes and pull requests build the debug APK. A v* tag builds the signed release APK and
# publishes it as a GitHub release, with the changelog from fastlane/ as notes.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          ndk=$(grep -oP 'ndkVersion = "\K[^"]+' app/build.gradle.kts)
          cmake=$(grep -oP 'version = "\K[0-9.]+(?="\s*$)' app/build.gradle.kts | head -1)
          sdkmanager "ndk;$ndk" "cmake;$cmake"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi
          export RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE"
          ./gradlew assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify "$apk"
          mv "$apk" "usb-camera-recorder-$version.apk"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          gh release create "$GITHUB_REF_NAME" usb-camera-recorder-*.apk \
            --title "$GITHUB_REF_NAME" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$code.txt"
